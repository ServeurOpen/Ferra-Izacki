<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum — FERRA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏️</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="../index.html" class="brand">FER<span>RA</span></a>
    <div class="nav-links">
      <a href="../index.html" class="nav-link">Accueil</a>
      <a href="../launcher.html" class="nav-link">Launcher</a>
      <a href="index.html" class="nav-link active">Forum</a>
      <a href="../contact.html" class="nav-link">Contact</a>
      <a href="../launcher.html" class="nav-cta">⬇ Télécharger</a>
      <span id="navAuth" class="nav-auth"></span>
    </div>
  </nav>
</header>

<section style="padding-top:34px;">
  <div class="container-narrow">
    <div class="breadcrumb">
      <a href="index.html">Forum</a><span class="sep">/</span>
      <a id="breadcrumbCat" href="#">…</a><span class="sep">/</span>
      <span id="breadcrumbThread">…</span>
    </div>

    <h1 id="threadTitle" style="font-size:24px;margin:0 0 20px;">…</h1>

    <div id="postsList">
      <div class="empty-state"><div class="big-icon">⏳</div>Chargement du sujet…</div>
    </div>

    <div id="replyBox" style="margin-top:20px;display:none;">
      <h3 style="font-size:15px;margin-bottom:14px;">✍️ Répondre</h3>
      <div class="form-error" id="replyError"></div>
      <div class="field">
        <textarea id="replyContent" placeholder="Ton message..."></textarea>
      </div>
      <button class="btn btn-primary" id="replySubmitBtn">Envoyer la réponse</button>
    </div>
    <div id="loginPrompt" class="card" style="display:none;margin-top:20px;text-align:center;">
      <p style="margin-bottom:14px;">Connecte-toi pour répondre à ce sujet.</p>
      <a href="login.html" class="btn btn-primary btn-sm">Se connecter</a>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-row">
    <div class="footer-note">FERRA — projet indépendant, développé avec passion. © 2026.</div>
    <div class="footer-links">
      <a href="../index.html">Accueil</a>
      <a href="../launcher.html">Launcher</a>
      <a href="index.html">Forum</a>
      <a href="../contact.html">Contact</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/forum.js"></script>
<script>
(async function () {
  ferraRenderNavAuth('navAuth', '../');
  const threadId = new URLSearchParams(location.search).get('id');
  const postsEl = document.getElementById('postsList');
  if (!threadId) { postsEl.innerHTML = `<div class="empty-state">Sujet introuvable.</div>`; return; }

  const session = await ferraGetSession();

  async function renderPosts() {
    const posts = await ferraFetchPosts(threadId);
    postsEl.innerHTML = posts.map(p => `
      <div class="post">
        <div class="post-author">
          <div class="post-avatar">${ferraInitials(p.profiles?.username)}</div>
          <div class="post-author-name">${ferraEscape(p.profiles?.username || 'Joueur')}</div>
        </div>
        <div class="post-body">
          <div class="post-meta">${ferraFormatDate(p.created_at)}</div>
          <div class="post-content">${ferraEscape(p.content)}</div>
        </div>
      </div>
    `).join('');
  }

  try {
    const thread = await ferraFetchThread(threadId);
    document.title = `${thread.title} — Forum FERRA`;
    document.getElementById('threadTitle').textContent = thread.title;
    document.getElementById('breadcrumbThread').textContent = thread.title;
    const catLink = document.getElementById('breadcrumbCat');
    catLink.textContent = thread.categories?.name || 'Catégorie';
    catLink.href = `category.html?slug=${encodeURIComponent(thread.categories?.slug || '')}`;

    await renderPosts();

    if (session) {
      document.getElementById('replyBox').style.display = 'block';
      document.getElementById('replySubmitBtn').addEventListener('click', async () => {
        const content = document.getElementById('replyContent').value.trim();
        const errEl = document.getElementById('replyError');
        errEl.classList.remove('show');
        if (!content) { errEl.textContent = 'Écris un message avant d\'envoyer.'; errEl.classList.add('show'); return; }
        try {
          await ferraCreatePost(threadId, session.user.id, content);
          document.getElementById('replyContent').value = '';
          await renderPosts();
        } catch (err) {
          errEl.textContent = 'Impossible d\'envoyer la réponse — réessaie.';
          errEl.classList.add('show');
          console.error(err);
        }
      });
    } else {
      document.getElementById('loginPrompt').style.display = 'block';
    }
  } catch (err) {
    postsEl.innerHTML = `<div class="empty-state"><div class="big-icon">⚠️</div>Impossible de charger ce sujet.</div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
