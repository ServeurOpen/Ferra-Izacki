<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau sujet — Forum FERRA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏️</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="../index.html" class="brand">FER<span>RA</span></a>
    <div class="nav-links">
      <a href="../index.html" class="nav-link">Accueil</a>
      <a href="../infos.html" class="nav-link">Infos &amp; Changelog</a>
      <a href="index.html" class="nav-link active">Forum</a>
      <a href="../contact.html" class="nav-link">Contact</a>
      <a href="../telechargement.html" class="nav-cta">⬇ Télécharger</a>
    </div>
  </nav>
</header>

<section style="padding-top:34px;">
  <div class="container-narrow">
    <div class="breadcrumb"><a href="index.html">Forum</a><span class="sep">/</span><a id="breadcrumbCat" href="#">…</a><span class="sep">/</span>Nouveau sujet</div>
    <h1 style="font-size:24px;margin:0 0 24px;">✏️ Nouveau sujet</h1>

    <div id="needLogin" class="card" style="display:none;text-align:center;">
      <p style="margin-bottom:14px;">Connecte-toi pour ouvrir un sujet.</p>
      <a href="login.html" class="btn btn-primary btn-sm">Se connecter</a>
    </div>

    <form id="newThreadForm" style="display:none;">
      <div class="form-error" id="formError"></div>
      <div class="field">
        <label for="threadTitleInput">Titre du sujet</label>
        <input type="text" id="threadTitleInput" maxlength="140" placeholder="Un titre clair et court" required>
      </div>
      <div class="field">
        <label for="threadMessageInput">Message</label>
        <textarea id="threadMessageInput" placeholder="Explique ton sujet en détail..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Publier le sujet</button>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-row">
    <div class="footer-note">FERRA — projet indépendant, développé avec passion. © 2026.</div>
    <div class="footer-links">
      <a href="../index.html">Accueil</a>
      <a href="../telechargement.html">Télécharger</a>
      <a href="../infos.html">Infos</a>
      <a href="index.html">Forum</a>
      <a href="../contact.html">Contact</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/forum.js"></script>
<script>
(async function () {
  const slug = new URLSearchParams(location.search).get('slug');
  if (!slug) { document.body.innerHTML = '<div class="empty-state">Catégorie manquante.</div>'; return; }

  let cat;
  try {
    cat = await ferraFetchCategoryBySlug(slug);
  } catch (err) {
    document.querySelector('.container-narrow').innerHTML = `<div class="empty-state"><div class="big-icon">⚠️</div>Impossible de charger cette catégorie.</div>`;
    console.error(err);
    return;
  }
  const catLink = document.getElementById('breadcrumbCat');
  catLink.textContent = cat.name;
  catLink.href = `category.html?slug=${encodeURIComponent(slug)}`;

  const session = await ferraGetSession();
  if (!session) {
    document.getElementById('needLogin').style.display = 'block';
    return;
  }
  document.getElementById('newThreadForm').style.display = 'block';

  document.getElementById('newThreadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('threadTitleInput').value.trim();
    const message = document.getElementById('threadMessageInput').value.trim();
    const errEl = document.getElementById('formError');
    errEl.classList.remove('show');
    if (!title || !message) {
      errEl.textContent = 'Le titre et le message sont obligatoires.';
      errEl.classList.add('show');
      return;
    }
    try {
      const thread = await ferraCreateThread(cat.id, session.user.id, title, message);
      window.location.href = `thread.html?id=${thread.id}`;
    } catch (err) {
      errEl.textContent = 'Impossible de créer le sujet — réessaie.';
      errEl.classList.add('show');
      console.error(err);
    }
  });
})();
</script>
</body>
</html>
