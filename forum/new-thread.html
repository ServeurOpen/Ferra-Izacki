<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="newThreadPage.pageTitle">Nouveau sujet — Forum FERRA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏️</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="../index.html" class="brand">FER<span>RA</span></a>
    <div class="nav-links">
      <a href="../index.html" class="nav-link" data-i18n="nav.home">Accueil</a>
      <a href="../launcher.html" class="nav-link" data-i18n="nav.launcher">Launcher</a>
      <a href="index.html" class="nav-link active" data-i18n="nav.forum">Forum</a>
      <a href="../contact.html" class="nav-link" data-i18n="nav.contact">Contact</a>
      <a href="../launcher.html" class="nav-cta" data-i18n="nav.download">⬇ Télécharger</a>
      <span id="navAuth" class="nav-auth"></span>
    </div>
  </nav>
</header>

<section style="padding-top:34px;">
  <div class="container-narrow">
    <div class="breadcrumb"><a href="index.html" data-i18n="nav.forum">Forum</a><span class="sep">/</span><a id="breadcrumbCat" href="#">…</a><span class="sep">/</span><span data-i18n="newThreadPage.breadcrumbNew">Nouveau sujet</span></div>
    <h1 style="font-size:24px;margin:0 0 24px;" data-i18n="newThreadPage.heading">✏️ Nouveau sujet</h1>

    <div id="needLogin" class="card" style="display:none;text-align:center;">
      <p style="margin-bottom:14px;" data-i18n="newThreadPage.needLogin">Connecte-toi pour ouvrir un sujet.</p>
      <a href="login.html" class="btn btn-primary btn-sm" data-i18n="nav.login">Se connecter</a>
    </div>

    <form id="newThreadForm" style="display:none;">
      <div class="form-error" id="formError"></div>
      <div class="field">
        <label for="threadTitleInput" data-i18n="newThreadPage.threadTitle">Titre du sujet</label>
        <input type="text" id="threadTitleInput" maxlength="140" data-i18n-placeholder="newThreadPage.threadTitlePlaceholder" placeholder="Un titre clair et court" required>
      </div>
      <div class="field">
        <label for="threadMessageInput" data-i18n="newThreadPage.message">Message</label>
        <textarea id="threadMessageInput" data-i18n-placeholder="newThreadPage.messagePlaceholder" placeholder="Explique ton sujet en détail..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" data-i18n="newThreadPage.submit">Publier le sujet</button>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-row">
    <div class="footer-note" data-i18n="footer.note">FERRA — projet indépendant, développé avec passion. © 2026.</div>
    <div class="footer-links">
      <a href="../index.html" data-i18n="nav.home">Accueil</a>
      <a href="../launcher.html" data-i18n="nav.launcher">Launcher</a>
      <a href="index.html" data-i18n="nav.forum">Forum</a>
      <a href="../contact.html" data-i18n="nav.contact">Contact</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/forum.js"></script>
<script>
(async function () {
  await ferraI18nInit('../');
  ferraRenderNavAuth('navAuth', '../');
  ferraI18nApply();
  const slug = new URLSearchParams(location.search).get('slug');
  if (!slug) { document.body.innerHTML = `<div class="empty-state">${ferraT('newThreadPage.missingCategory', 'Catégorie manquante.')}</div>`; return; }

  let cat;
  try {
    cat = await ferraFetchCategoryBySlug(slug);
  } catch (err) {
    document.querySelector('.container-narrow').innerHTML = `<div class="empty-state"><div class="big-icon">⚠️</div>${ferraT('forumCategory.loadError', 'Impossible de charger cette catégorie.')}</div>`;
    console.error(err);
    return;
  }
  const catLink = document.getElementById('breadcrumbCat');
  catLink.textContent = cat.name;
  catLink.href = `category.html?slug=${encodeURIComponent(slug)}`;

  const session = await ferraGetSession();
  if (!session) {
    document.getElementById('needLogin').style.display = 'block';
    return;
  }
  document.getElementById('newThreadForm').style.display = 'block';

  document.getElementById('newThreadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('threadTitleInput').value.trim();
    const message = document.getElementById('threadMessageInput').value.trim();
    const errEl = document.getElementById('formError');
    errEl.classList.remove('show');
    if (!title || !message) {
      errEl.textContent = ferraT('newThreadPage.errRequired', 'Le titre et le message sont obligatoires.');
      errEl.classList.add('show');
      return;
    }
    try {
      const thread = await ferraCreateThread(cat.id, session.user.id, title, message);
      window.location.href = `thread.html?id=${thread.id}`;
    } catch (err) {
      errEl.textContent = ferraT('newThreadPage.errCreateFailed', 'Impossible de créer le sujet — réessaie.');
      errEl.classList.add('show');
      console.error(err);
    }
  });
})();
</script>
</body>
</html>
