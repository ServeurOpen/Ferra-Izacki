<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="forumIndex.pageTitle">Forum — FERRA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏️</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="../index.html" class="brand">FER<span>RA</span></a>
    <div class="nav-links">
      <a href="../index.html" class="nav-link" data-i18n="nav.home">Accueil</a>
      <a href="../launcher.html" class="nav-link" data-i18n="nav.launcher">Launcher</a>
      <a href="index.html" class="nav-link active" data-i18n="nav.forum">Forum</a>
      <a href="../contact.html" class="nav-link" data-i18n="nav.contact">Contact</a>
      <a href="../launcher.html" class="nav-cta" data-i18n="nav.download">⬇ Télécharger</a>
      <span id="navAuth" class="nav-auth"></span>
    </div>
  </nav>
</header>

<div class="page-header">
  <div class="container-narrow">
    <h1 data-i18n="forumIndex.heading">💬 Forum FERRA</h1>
    <p data-i18n="forumIndex.sub">Discussions, support, idées — choisis une catégorie pour voir les sujets.</p>
  </div>
</div>

<section style="padding-top:10px;">
  <div class="container-narrow">
    <div class="forum-toolbar">
      <div id="forumUserWidget" class="forum-user">Chargement…</div>
    </div>

    <div id="categoriesList">
      <div class="empty-state"><div class="big-icon">⏳</div><span data-i18n="forumIndex.loadingCategories">Chargement des catégories…</span></div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-row">
    <div class="footer-note" data-i18n="footer.note">FERRA — projet indépendant, développé avec passion. © 2026.</div>
    <div class="footer-links">
      <a href="../index.html" data-i18n="nav.home">Accueil</a>
      <a href="../launcher.html" data-i18n="nav.launcher">Launcher</a>
      <a href="index.html" data-i18n="nav.forum">Forum</a>
      <a href="../contact.html" data-i18n="nav.contact">Contact</a>
    </div>
  </div>
</footer>

<a href="../faq.html" class="faq-bubble" title="Questions fréquentes"><span class="faq-bubble-icon">❓</span><span>FAQ</span></a>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/forum.js"></script>
<script>
(async function () {
  await ferraI18nInit('../');
  await ferraRenderUserWidget('forumUserWidget');
  ferraRenderNavAuth('navAuth', '../');
  ferraI18nApply();

  const listEl = document.getElementById('categoriesList');
  try {
    const categories = await ferraFetchCategories();
    if (!categories.length) {
      listEl.innerHTML = `<div class="empty-state"><div class="big-icon">🗂️</div>${ferraT('forumIndex.noCategories', "Aucune catégorie pour l'instant.")}</div>`;
      return;
    }
    const sujetWord = (n) => n === 1 ? ferraT('forumIndex.thread', 'sujet') : ferraT('forumIndex.threads', 'sujets');
    listEl.innerHTML = categories.map(cat => `
      <a class="category-card" href="category.html?slug=${encodeURIComponent(cat.slug)}">
        <div class="category-icon">${cat.icon}</div>
        <div class="category-body">
          <h3>${ferraEscape(cat.name)}</h3>
          <p>${ferraEscape(cat.description || '')}</p>
        </div>
        <div class="category-stats"><b>${cat.threadCount}</b>${sujetWord(cat.threadCount)}</div>
      </a>
    `).join('');
  } catch (err) {
    listEl.innerHTML = `<div class="empty-state"><div class="big-icon">⚠️</div>${ferraT('forumIndex.notConfigured', "Le forum n'est pas encore configuré.")}<br><span style="font-size:12px;">${ferraT('forumIndex.notConfiguredHint', '(voir le README.md du site — assets/js/config.js à compléter)')}</span></div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
