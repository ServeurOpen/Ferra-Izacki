<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum — FERRA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏️</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="../index.html" class="brand">FER<span>RA</span></a>
    <div class="nav-links">
      <a href="../index.html" class="nav-link">Accueil</a>
      <a href="../infos.html" class="nav-link">Infos &amp; Changelog</a>
      <a href="index.html" class="nav-link active">Forum</a>
      <a href="../contact.html" class="nav-link">Contact</a>
      <a href="../telechargement.html" class="nav-cta">⬇ Télécharger</a>
    </div>
  </nav>
</header>

<div class="page-header">
  <div class="container-narrow">
    <h1>💬 Forum FERRA</h1>
    <p>Discussions, support, idées — choisis une catégorie pour voir les sujets.</p>
  </div>
</div>

<section style="padding-top:10px;">
  <div class="container-narrow">
    <div class="forum-toolbar">
      <div id="forumUserWidget" class="forum-user">Chargement…</div>
    </div>

    <div id="categoriesList">
      <div class="empty-state"><div class="big-icon">⏳</div>Chargement des catégories…</div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-row">
    <div class="footer-note">FERRA — projet indépendant, développé avec passion. © 2026.</div>
    <div class="footer-links">
      <a href="../index.html">Accueil</a>
      <a href="../telechargement.html">Télécharger</a>
      <a href="../infos.html">Infos</a>
      <a href="index.html">Forum</a>
      <a href="../contact.html">Contact</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/forum.js"></script>
<script>
(async function () {
  await ferraRenderUserWidget('forumUserWidget');

  const listEl = document.getElementById('categoriesList');
  try {
    const categories = await ferraFetchCategories();
    if (!categories.length) {
      listEl.innerHTML = `<div class="empty-state"><div class="big-icon">🗂️</div>Aucune catégorie pour l'instant.</div>`;
      return;
    }
    listEl.innerHTML = categories.map(cat => `
      <a class="category-card" href="category.html?slug=${encodeURIComponent(cat.slug)}">
        <div class="category-icon">${cat.icon}</div>
        <div class="category-body">
          <h3>${ferraEscape(cat.name)}</h3>
          <p>${ferraEscape(cat.description || '')}</p>
        </div>
        <div class="category-stats"><b>${cat.threadCount}</b>sujet${cat.threadCount === 1 ? '' : 's'}</div>
      </a>
    `).join('');
  } catch (err) {
    listEl.innerHTML = `<div class="empty-state"><div class="big-icon">⚠️</div>Le forum n'est pas encore configuré.<br><span style="font-size:12px;">(voir le README.md du site — assets/js/config.js à compléter)</span></div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
