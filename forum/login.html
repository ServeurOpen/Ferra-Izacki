<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="loginPage.pageTitle">Connexion — Forum FERRA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏️</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="../index.html" class="brand">FER<span>RA</span></a>
    <div class="nav-links">
      <a href="../index.html" class="nav-link" data-i18n="nav.home">Accueil</a>
      <a href="../launcher.html" class="nav-link" data-i18n="nav.launcher">Launcher</a>
      <a href="index.html" class="nav-link active" data-i18n="nav.forum">Forum</a>
      <a href="../contact.html" class="nav-link" data-i18n="nav.contact">Contact</a>
      <a href="../launcher.html" class="nav-cta" data-i18n="nav.download">⬇ Télécharger</a>
    </div>
  </nav>
</header>

<div class="auth-shell">
  <h1 data-i18n="loginPage.heading">🔑 Connexion</h1>
  <p class="sub" data-i18n="loginPage.sub">Content de te revoir, aventurier.</p>
  <div class="form-error" id="loginError"></div>
  <form id="loginForm">
    <div class="field">
      <label for="loginEmail" data-i18n="loginPage.email">Email</label>
      <input type="email" id="loginEmail" required autocomplete="email">
    </div>
    <div class="field">
      <label for="loginPassword" data-i18n="loginPage.password">Mot de passe</label>
      <input type="password" id="loginPassword" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block" data-i18n="loginPage.submit">Se connecter</button>
  </form>
  <p class="sub" style="margin-top:14px;"><a href="forgot-password.html" style="color:var(--text-dim);" data-i18n="loginPage.forgotPassword">Mot de passe oublié ?</a></p>
  <p class="sub" style="margin-top:6px;"><span data-i18n="loginPage.noAccount">Pas encore de compte ?</span> <a href="signup.html" style="color:var(--copper-glow);font-weight:600;" data-i18n="loginPage.signupLink">Inscris-toi</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/i18n.js"></script>
<script>
(async function () {
  await ferraI18nInit('../');
  ferraI18nApply();
})();
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  // Connexion par EMAIL uniquement (le pseudo reste le nom affiché sur le
  // forum, mais ne sert plus à se connecter) — voir auth.js pour le
  // pourquoi : la connexion par pseudo reposait sur une fonction SQL
  // (get_email_by_username) jamais réellement déployée en base, donc
  // toujours en échec, quel que soit le pseudo tapé. En plus de corriger
  // ça, un champ email dédié (type="email", autocomplete="email") permet
  // au gestionnaire de mots de passe du navigateur d'enregistrer et de
  // proposer l'auto-remplissage email+mot de passe, au lieu de pseudo+mot
  // de passe qui ne servait à rien pour se reconnecter.
  const { error } = await ferraSignIn(email, password);
  if (error) {
    // Messages distincts pour les cas fréquents (31/08/2026, retour joueur
    // "même quand ça marche la connexion ne fonctionne pas") — un compte
    // créé avant la désactivation de la confirmation par email reste
    // bloqué avec le message générique "identifiants incorrects", ce qui
    // ressemblait à un mot de passe faux alors que le vrai souci est
    // ailleurs. Voir README.md, section "Comptes joueurs".
    const msg = (error.message || '').toLowerCase();
    errEl.textContent = msg.includes('email not confirmed')
      ? ferraT('loginPage.errEmailNotConfirmed', "Ce compte n'a pas encore confirmé son email — vérifie ta boîte mail (et les spams), ou écris-nous en contact si l'email n'est jamais arrivé.")
      : msg.includes('rate limit') || msg.includes('429')
      ? ferraT('loginPage.errRateLimit', 'Trop de tentatives récentes — réessaie dans quelques minutes.')
      : ferraT('loginPage.errInvalid', 'Email ou mot de passe incorrect.');
    errEl.classList.add('show');
    return;
  }
  window.location.href = 'index.html';
});
</script>
</body>
</html>
