<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Forum FERRA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏️</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="../index.html" class="brand">FER<span>RA</span></a>
    <div class="nav-links">
      <a href="../index.html" class="nav-link">Accueil</a>
      <a href="../infos.html" class="nav-link">Infos &amp; Changelog</a>
      <a href="index.html" class="nav-link active">Forum</a>
      <a href="../telechargement.html" class="nav-cta">⬇ Télécharger</a>
    </div>
  </nav>
</header>

<div class="auth-shell">
  <h1>🔑 Connexion</h1>
  <p class="sub">Content de te revoir, aventurier.</p>
  <div class="form-error" id="loginError"></div>
  <form id="loginForm">
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" required autocomplete="email">
    </div>
    <div class="field">
      <label for="loginPassword">Mot de passe</label>
      <input type="password" id="loginPassword" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
  </form>
  <p class="sub" style="margin-top:18px;">Pas encore de compte ? <a href="signup.html" style="color:var(--copper-glow);font-weight:600;">Inscris-toi</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  const { error } = await ferraSignIn(email, password);
  if (error) {
    errEl.textContent = 'Email ou mot de passe incorrect.';
    errEl.classList.add('show');
    return;
  }
  window.location.href = 'index.html';
});
</script>
</body>
</html>
