<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="forumIndex.pageTitle">Forum — FERRA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏️</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="../index.html" class="brand">FER<span>RA</span></a>
    <div class="nav-links">
      <a href="../index.html" class="nav-link" data-i18n="nav.home">Accueil</a>
      <a href="../launcher.html" class="nav-link" data-i18n="nav.launcher">Launcher</a>
      <a href="index.html" class="nav-link active" data-i18n="nav.forum">Forum</a>
      <a href="../contact.html" class="nav-link" data-i18n="nav.contact">Contact</a>
      <a href="../launcher.html" class="nav-cta" data-i18n="nav.download">⬇ Télécharger</a>
      <span id="navAuth" class="nav-auth"></span>
    </div>
  </nav>
</header>

<section style="padding-top:34px;">
  <div class="container-narrow">
    <div class="breadcrumb"><a href="index.html" data-i18n="nav.forum">Forum</a><span class="sep">/</span><span id="breadcrumbCat">…</span></div>

    <div class="forum-toolbar">
      <div>
        <h1 id="catTitle" style="font-size:26px;margin:0 0 4px;">…</h1>
        <p id="catDesc" style="color:var(--text-dim);font-size:13.5px;margin:0;"></p>
      </div>
      <a id="newThreadBtn" href="#" class="btn btn-primary btn-sm" data-i18n="forumCategory.newThread">✏️ Nouveau sujet</a>
    </div>
    <div id="forumUserWidget" class="forum-user" style="margin-bottom:18px;"></div>

    <div id="threadsList">
      <div class="empty-state"><div class="big-icon">⏳</div><span data-i18n="forumCategory.loadingThreads">Chargement des sujets…</span></div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-row">
    <div class="footer-note" data-i18n="footer.note">FERRA — projet indépendant, développé avec passion. © 2026.</div>
    <div class="footer-links">
      <a href="../index.html" data-i18n="nav.home">Accueil</a>
      <a href="../launcher.html" data-i18n="nav.launcher">Launcher</a>
      <a href="index.html" data-i18n="nav.forum">Forum</a>
      <a href="../contact.html" data-i18n="nav.contact">Contact</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/forum.js"></script>
<script>
(async function () {
  await ferraI18nInit('../');
  await ferraRenderUserWidget('forumUserWidget');
  ferraRenderNavAuth('navAuth', '../');
  ferraI18nApply();

  const slug = new URLSearchParams(location.search).get('slug');
  const listEl = document.getElementById('threadsList');
  if (!slug) { listEl.innerHTML = `<div class="empty-state">${ferraT('forumCategory.notFound', 'Catégorie introuvable.')}</div>`; return; }

  try {
    const cat = await ferraFetchCategoryBySlug(slug);
    document.getElementById('catTitle').textContent = `${cat.icon} ${cat.name}`;
    document.getElementById('catDesc').textContent = cat.description || '';
    document.getElementById('breadcrumbCat').textContent = cat.name;
    document.title = `${cat.name} — ${ferraT('forumCategory.titleSuffix', 'Forum FERRA')}`;
    document.getElementById('newThreadBtn').href = `new-thread.html?slug=${encodeURIComponent(cat.slug)}`;

    const threads = await ferraFetchThreads(cat.id);
    if (!threads.length) {
      listEl.innerHTML = `<div class="empty-state"><div class="big-icon">📭</div>${ferraT('forumCategory.noThreads', "Aucun sujet ici pour l'instant — sois le premier à en ouvrir un !")}</div>`;
      return;
    }
    const replyWord = (n) => n === 1 ? ferraT('forumCategory.reply', 'réponse') : ferraT('forumCategory.replies', 'réponses');
    listEl.innerHTML = threads.map(t => `
      <a class="thread-row ${t.pinned ? 'pinned' : ''}" href="thread.html?id=${t.id}">
        <div style="flex:1;min-width:0;">
          <div class="thread-title">${t.pinned ? '📌 ' : ''}${ferraEscape(t.title)}</div>
          <div class="thread-meta">${ferraT('forumCategory.by', 'par')} <b>${ferraEscape(t.profiles?.username || ferraT('nav.defaultPlayer', 'Joueur'))}</b> · ${ferraFormatDate(t.created_at)}</div>
        </div>
        <div class="thread-stats"><b>${t.replyCount}</b>${replyWord(t.replyCount)}</div>
      </a>
    `).join('');
  } catch (err) {
    listEl.innerHTML = `<div class="empty-state"><div class="big-icon">⚠️</div>${ferraT('forumCategory.loadError', 'Impossible de charger cette catégorie.')}</div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
