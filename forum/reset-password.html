<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Forum FERRA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏️</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="../index.html" class="brand">FER<span>RA</span></a>
    <div class="nav-links">
      <a href="../index.html" class="nav-link">Accueil</a>
      <a href="../launcher.html" class="nav-link">Launcher</a>
      <a href="index.html" class="nav-link active">Forum</a>
      <a href="../contact.html" class="nav-link">Contact</a>
      <a href="../launcher.html" class="nav-cta">🚀 Launcher</a>
    </div>
  </nav>
</header>

<div class="auth-shell">
  <h1>🔑 Nouveau mot de passe</h1>
  <p class="sub" id="resetSub">Choisis ton nouveau mot de passe.</p>
  <div class="form-error" id="resetError"></div>
  <div class="form-success" id="resetSuccess">Mot de passe mis à jour ! Tu peux maintenant te connecter.</div>
  <form id="resetForm">
    <div class="field">
      <label for="resetPassword">Nouveau mot de passe</label>
      <input type="password" id="resetPassword" minlength="6" required autocomplete="new-password">
    </div>
    <div class="field">
      <label for="resetPassword2">Confirme le mot de passe</label>
      <input type="password" id="resetPassword2" minlength="6" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Valider</button>
  </form>
  <p class="sub" style="margin-top:18px;"><a href="login.html" style="color:var(--copper-glow);font-weight:600;">← Retour à la connexion</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
// Le lien reçu par email contient un jeton dans l'URL ; supabase-js le
// détecte tout seul à l'ouverture de la page (detectSessionInUrl) et
// déclenche un événement PASSWORD_RECOVERY une fois la session prête.
// Sans ce jeton (page ouverte directement, lien expiré/déjà utilisé),
// on bloque le formulaire plutôt que de laisser échouer updateUser en silence.
let recoveryReady = false;
const form = document.getElementById('resetForm');
const errEl = document.getElementById('resetError');
const okEl = document.getElementById('resetSuccess');
const subEl = document.getElementById('resetSub');

window.supabaseClient.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    recoveryReady = true;
  }
});

// Filet de sécurité : si l'événement n'arrive pas dans les 3s (lien invalide
// ou déjà consommé), on prévient plutôt que de laisser un formulaire mort.
setTimeout(() => {
  if (!recoveryReady) {
    subEl.textContent = '';
    errEl.textContent = "Ce lien n'est plus valide (déjà utilisé, ou expiré après ~1h) — redemande un lien depuis la page « mot de passe oublié ».";
    errEl.classList.add('show');
    form.style.display = 'none';
  }
}, 3000);

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.classList.remove('show');
  okEl.classList.remove('show');
  const p1 = document.getElementById('resetPassword').value;
  const p2 = document.getElementById('resetPassword2').value;
  if (p1 !== p2) {
    errEl.textContent = 'Les deux mots de passe ne correspondent pas.';
    errEl.classList.add('show');
    return;
  }
  if (!recoveryReady) {
    errEl.textContent = "Lien invalide ou expiré — redemande un lien depuis la page « mot de passe oublié ».";
    errEl.classList.add('show');
    return;
  }
  const { error } = await ferraUpdatePassword(p1);
  if (error) {
    errEl.textContent = "Impossible de mettre à jour le mot de passe — réessaie.";
    errEl.classList.add('show');
    return;
  }
  okEl.classList.add('show');
  form.style.display = 'none';
});
</script>
</body>
</html>
